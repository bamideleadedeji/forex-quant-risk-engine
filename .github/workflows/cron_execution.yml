name: Multi-Forex Automated Quant Cycle

on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

concurrency:
  group: quant-cycle
  cancel-in-progress: false

jobs:
  run-quant-engine:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download & Install Exness MT5 Terminal
        shell: powershell
        run: |
          # Force TLS 1.2 and bypass runner SSL certificate validation
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          [System.Net.ServicePointManager]::ServerCertificateValidationCallback = {$true}

          Write-Host "🚀 Downloading Exness MT5 Setup via TLS 1.2..."
          $url = "https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe"
          $output = "exness5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

          if (-not (Test-Path $output)) {
              throw "❌ Download failed: exness5setup.exe was not created."
          }

          Write-Host "⚙️ Installing MetaTrader 5 silently..."
          Start-Process -FilePath ".\exness5setup.exe" -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 10

      - name: Configure Headless Startup & Execute Quant Engine
        shell: powershell
        env:
          PYTHONIOENCODING: "utf-8"
          EXNESS_MT5_LOGIN: ${{ secrets.EXNESS_MT5_LOGIN }}
          EXNESS_MT5_PASSWORD: ${{ secrets.EXNESS_MT5_PASSWORD }}
          EXNESS_MT5_SERVER: ${{ secrets.EXNESS_MT5_SERVER }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          $mt5Path = Get-ChildItem -Path "C:\Program Files" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1

          if (-not $mt5Path) { throw "terminal64.exe not found after install" }
          Write-Host "Found MT5 terminal: $mt5Path"
          $env:MT5_PATH = $mt5Path

          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

          $mt5Dir = Split-Path -Path $mt5Path -Parent
          $configPath = Join-Path -Path $mt5Dir -ChildPath "config.ini"

          "[Common]" | Out-File -FilePath $configPath -Encoding ascii
          "Login=$env:EXNESS_MT5_LOGIN" | Out-File -FilePath $configPath -Encoding ascii -Append
          "Password=$env:EXNESS_MT5_PASSWORD" | Out-File -FilePath $configPath -Encoding ascii -Append
          "Server=$env:EXNESS_MT5_SERVER" | Out-File -FilePath $configPath -Encoding ascii -Append
          "EnableNews=0" | Out-File -FilePath $configPath -Encoding ascii -Append

          Write-Host "Launching MT5 Terminal from: $mt5Path"
          Start-Process -FilePath $mt5Path -ArgumentList "/config:`"$configPath`" /portable"
          Start-Sleep -Seconds 30

          python multi_forex_quant_bot.py

      - name: Upload Trade Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-log-${{ github.run_id }}
          path: trade_log.csv
          if-no-files-found: ignore
